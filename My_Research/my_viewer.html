<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>마이 리서치 — 주식 리서치 허브</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1a56db;--primary-dark:#1239a0;--primary-light:#3b82f6;
  --navy:#0f2244;--navy-mid:#1e3a5f;--accent:#60a5fa;
  --theme:#0d9488;--theme-dark:#0f766e;--theme-light:#5eead4;
  --bg:#f0f5fb;--card:#fff;--border:#dbe8f8;
  --text:#1e293b;--muted:#64748b;--light:#94a3b8;
  --shadow-md:0 4px 20px rgba(26,86,219,.12);
  --radius:12px;--radius-sm:8px;--t:.22s cubic-bezier(.4,0,.2,1);
}
html,body{height:100%;scroll-behavior:smooth}
body{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
      background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh}
a{text-decoration:none;color:inherit}

/* ── 네비바 ── */
.navbar{position:sticky;top:0;z-index:200;background:var(--navy);box-shadow:0 2px 12px rgba(0,0,0,.3)}
.nb{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:8px;height:60px}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-size:1.05rem;font-weight:700;margin-right:12px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--primary-light),var(--accent));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.nav-links{display:flex;align-items:center;gap:2px;list-style:none;flex:1}
.nav-links a{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;color:rgba(255,255,255,.75);font-size:.88rem;font-weight:500;transition:var(--t)}
.nav-links a:hover,.nav-links a.active{background:rgba(255,255,255,.12);color:#fff}
.nav-right{display:flex;align-items:center;gap:8px;margin-left:auto}
#ts{color:rgba(255,255,255,.45);font-size:.75rem}

/* ── 리포트 툴바 ── */
.report-bar{background:var(--card);border-bottom:1px solid var(--border);
             padding:10px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
             position:sticky;top:60px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.rb-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.rb-title{font-size:.9rem;font-weight:700;color:var(--text);
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:480px}
.rb-date{font-size:.78rem;font-weight:600;color:var(--theme);
          background:#f0fdfa;border:1px solid #99f6e4;padding:3px 10px;border-radius:6px;white-space:nowrap}
.rb-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.nav-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--radius-sm);
          font-size:.82rem;font-weight:600;border:1px solid;transition:var(--t);white-space:nowrap;cursor:pointer}
.nav-btn.back{background:#f0fdfa;color:var(--theme);border-color:#99f6e4}
.rb-cat{font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap;background:#f1f5f9;color:#334155}
.nav-btn.back:hover{background:var(--theme);color:#fff;border-color:var(--theme)}
.nav-btn.prev{background:#f0fdf4;color:#15803d;border-color:#bbf7d0}
.nav-btn.prev:hover{background:#15803d;color:#fff;border-color:#15803d}
.nav-btn.next{background:#fef3c7;color:#92400e;border-color:#fde68a}
.nav-btn.next:hover{background:#92400e;color:#fff;border-color:#92400e}
.nav-btn.disabled{opacity:.35;pointer-events:none}
.nav-btn.pdf{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.nav-btn.pdf:hover{background:#b91c1c;color:#fff;border-color:#b91c1c}
.sep{color:var(--border);font-size:1.2rem;user-select:none}
.pos-badge{font-size:.75rem;color:var(--muted);white-space:nowrap}

/* ── iframe 래퍼 ── */
.viewer-wrap{flex:1;display:flex;flex-direction:column;background:#fff}
#reportFrame{width:100%;border:none;flex:1;min-height:600px;display:block}

/* ── PDF (PDF.js 렌더링) ── */
#pdfWrap{display:none;flex:1;background:#525659;padding:16px 8px 24px}
.pdf-page{position:relative;margin:0 auto 14px;max-width:1100px;width:100%;
          background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.pdf-page canvas{display:block;width:100%;height:100%}
.pdf-page .pg-no{position:absolute;right:8px;bottom:6px;font-size:.7rem;color:#64748b;
                  background:rgba(255,255,255,.85);padding:1px 6px;border-radius:4px}
.pdf-msg{max-width:640px;margin:60px auto;text-align:center;color:#e2e8f0;font-size:.92rem;line-height:1.7}
.pdf-msg a{color:#93c5fd;text-decoration:underline}

/* ── 하단 네비 ── */
.bottom-nav{background:var(--card);border-top:1px solid var(--border);padding:14px 24px;
             display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bn-btn{display:flex;flex-direction:column;padding:12px 20px;border-radius:var(--radius);
         border:1px solid var(--border);background:var(--card);transition:var(--t);
         max-width:320px;flex:1;cursor:pointer}
.bn-btn:hover{border-color:var(--theme-light);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.bn-btn.disabled{opacity:.3;pointer-events:none}
.bn-label{font-size:.72rem;color:var(--muted);font-weight:600;margin-bottom:4px}
.bn-title{font-size:.88rem;font-weight:700;color:var(--text);
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bn-date{font-size:.75rem;color:var(--theme);margin-top:2px}
.bn-center{display:flex;align-items:center;gap:8px}
.list-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;
           border-radius:var(--radius-sm);background:var(--theme);color:#fff;
           font-size:.85rem;font-weight:700;border:none;cursor:pointer;transition:var(--t)}
.list-btn:hover{background:var(--theme-dark)}

/* ── 로딩 오버레이 ── */
#loading{position:fixed;inset:0;background:rgba(240,245,251,.85);
          display:flex;align-items:center;justify-content:center;z-index:999;
          flex-direction:column;gap:12px}
.spinner{width:40px;height:40px;border:3px solid var(--border);
          border-top-color:var(--theme);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{color:var(--muted);font-size:.9rem}

/* ── 반응형 ── */
@media(max-width:800px){
  .nav-links{display:none}
  .rb-title{max-width:200px}
  .report-bar{gap:6px}
}
</style>
<script src="../navbar.js"></script>
<script src="../manifest.js"></script>
</head>
<body>

<!-- 네비바 -->
<nav class="navbar">
  <div class="nb">
    <a href="../index.html" class="logo">
      <div class="logo-icon">📈</div>주식 리서치 허브
    </a>
    <ul class="nav-links"></ul>
    <div class="nav-right"><span id="ts"></span></div>
  </div>
</nav>

<!-- 리포트 툴바 -->
<div class="report-bar" id="reportBar">
  <div class="rb-left">
    <span id="rbCat" class="rb-cat"></span>
    <span id="rbDate" class="rb-date"></span>
    <span id="rbTitle" class="rb-title"></span>
  </div>
  <div class="rb-right">
    <a id="btnPdf" class="nav-btn pdf" href="#" target="_blank" rel="noopener" style="display:none">📄 PDF 새 창으로 열기</a>
    <a href="my_list.html" class="nav-btn back">📋 목록으로</a>
    <span class="sep">|</span>
    <span class="pos-badge" id="posBadge"></span>
    <button id="btnPrev" class="nav-btn prev" onclick="goPrev()">◀ 이전</button>
    <button id="btnNext" class="nav-btn next" onclick="goNext()">이후 ▶</button>
  </div>
</div>

<!-- 로딩 -->
<div id="loading">
  <div class="spinner"></div>
  <p>리포트를 불러오는 중...</p>
</div>

<!-- iframe -->
<div class="viewer-wrap">
  <iframe id="reportFrame" src="" title="리포트"></iframe>
  <div id="pdfWrap"></div>
</div>

<!-- 하단 네비 -->
<div class="bottom-nav" id="bottomNav" style="display:none">
  <div id="btnPrevBottom" class="bn-btn disabled" onclick="goPrev()">
    <div class="bn-label">◀ 이전 게시물</div>
    <div id="prevTitle" class="bn-title">—</div>
    <div id="prevDate"  class="bn-date">—</div>
  </div>
  <div class="bn-center">
    <a href="my_list.html" class="list-btn">📋 목록으로 돌아가기</a>
  </div>
  <div id="btnNextBottom" class="bn-btn disabled" onclick="goNext()" style="text-align:right">
    <div class="bn-label">이후 게시물 ▶</div>
    <div id="nextTitle" class="bn-title">—</div>
    <div id="nextDate"  class="bn-date">—</div>
  </div>
</div>

<script>
// ── 데이터 ───────────────────────────────────────────────────
var DATA = (window.SITE_MANIFEST && window.SITE_MANIFEST["My_Research"]) || [];

// ── 유틸 ─────────────────────────────────────────────────────
function fmt(s){
  if(!s) return '';
  var p = s.split('-');
  return p.length===3 ? p[0]+'.'+p[1]+'.'+p[2] : s;
}
function getParam(key){
  var p = new URLSearchParams(window.location.search);
  return p.get(key)||'';
}
function setParam(key, val){
  var p = new URLSearchParams(window.location.search);
  p.set(key, val);
  return '?'+p.toString();
}

// ── 현재 인덱스 계산 ─────────────────────────────────────────
var currentFile = '';
var currentIdx  = -1;

function findIdx(file){
  for(var i=0;i<DATA.length;i++){
    var f = DATA[i].file || '';
    if(f === file) return i;
  }
  return -1;
}

// ── iframe 로드 ──────────────────────────────────────────────
document.getElementById('reportFrame').addEventListener('load', onFrameLoad);
function onFrameLoad(){
  // PDF는 iframe이 아니라 PDF.js(renderPdf)가 처리한다
  if(/\.pdf$/i.test(currentFile)) return;
  document.getElementById('loading').style.display = 'none';
  document.getElementById('bottomNav').style.display = '';
  var frame = document.getElementById('reportFrame');
  // 높이 자동 조정
  try{
    var h = frame.contentWindow.document.documentElement.scrollHeight
          || frame.contentWindow.document.body.scrollHeight;
    if(h > 400) frame.style.height = h + 'px';
  } catch(e){
    frame.style.height = '90vh';
  }
}

// ── 리포트 로드 ──────────────────────────────────────────────
function loadReport(file){
  if(!file){ showError(); return; }
  currentFile = file;
  currentIdx  = findIdx(file);
  var item    = currentIdx >= 0 ? DATA[currentIdx] : null;
  var title   = item ? (item.title||item.name||file) : file;
  var date    = item ? fmt(item.date) : '';

  // 툴바 업데이트
  document.getElementById('rbTitle').textContent = title;
  document.getElementById('rbDate').textContent  = date;
  var CATN = {scrap:'📎 스크랩', research:'🔍 리서치', note:'📝 투자 노트'};
  document.getElementById('rbCat').textContent = item ? (CATN[item.category]||CATN.research) : '';
  document.title = title + ' — 주식 리서치 허브';

  // 위치 배지
  var total = DATA.length;
  document.getElementById('posBadge').textContent =
    currentIdx >= 0 ? (currentIdx+1)+'/'+total : '';

  // 이전 / 다음 계산 (최신순이므로 idx+1 = 이전, idx-1 = 이후)
  var hasPrev = currentIdx < DATA.length - 1;
  var hasNext = currentIdx > 0;
  var prevItem = hasPrev ? DATA[currentIdx+1] : null;
  var nextItem = hasNext ? DATA[currentIdx-1] : null;

  // 툴바 버튼
  var btnP = document.getElementById('btnPrev');
  var btnN = document.getElementById('btnNext');
  btnP.classList.toggle('disabled', !hasPrev);
  btnN.classList.toggle('disabled', !hasNext);

  // 하단 카드
  var bpB = document.getElementById('btnPrevBottom');
  var bnB = document.getElementById('btnNextBottom');
  bpB.classList.toggle('disabled', !hasPrev);
  bnB.classList.toggle('disabled', !hasNext);
  document.getElementById('prevTitle').textContent = prevItem ? (prevItem.title||prevItem.name||'') : '첫 번째 게시물입니다';
  document.getElementById('prevDate').textContent  = prevItem ? fmt(prevItem.date) : '';
  document.getElementById('nextTitle').textContent = nextItem ? (nextItem.title||nextItem.name||'') : '마지막 게시물입니다';
  document.getElementById('nextDate').textContent  = nextItem ? fmt(nextItem.date) : '';

  // 본문 로드: HTML은 iframe, PDF는 PDF.js로 전 페이지를 직접 그린다
  // (iPad·iPhone Safari는 iframe 안 PDF를 첫 페이지만 보여 준다)
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('bottomNav').style.display = 'none';
  var frame = document.getElementById('reportFrame');
  var pdfWrap = document.getElementById('pdfWrap');
  var isPdf = /\.pdf$/i.test(file);
  var url = encodeURIComponent(file);
  closePdf();
  if(isPdf){
    frame.style.display = 'none';
    frame.removeAttribute('srcdoc');
    frame.src = 'about:blank';
    pdfWrap.style.display = 'block';
    renderPdf(url);
  } else {
    pdfWrap.style.display = 'none';
    frame.style.display = '';
    frame.removeAttribute('srcdoc');
    frame.style.height = '80vh';
    frame.src = url;
  }

  // PDF면 새 창 열기 버튼도 노출 (다운로드·인쇄용)
  var btnPdf = document.getElementById('btnPdf');
  btnPdf.style.display = isPdf ? '' : 'none';
  btnPdf.href = isPdf ? url : '#';

  // URL 업데이트
  history.replaceState(null,'', setParam('file', file));
  window.scrollTo({top:0, behavior:'smooth'});
}

function goPrev(){
  if(currentIdx < DATA.length-1){
    var f = DATA[currentIdx+1].file || '';
    if(f) loadReport(f);
  }
}
function goNext(){
  if(currentIdx > 0){
    var f = DATA[currentIdx-1].file || '';
    if(f) loadReport(f);
  }
}

// ── PDF.js 렌더링 ───────────────────────────────────────────
// 화면 근처에 온 페이지만 그리고, 멀어진 페이지는 canvas를 비워
// 70쪽 넘는 PDF도 iPad 메모리 한도 안에서 볼 수 있게 한다.
var PDFJS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
var pdfjsPromise = null;
var pdfState = null;   // {gen, doc, observer, task}
var pdfGen = 0;

function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfjsPromise) return pdfjsPromise;
  pdfjsPromise = new Promise(function(resolve, reject){
    var s = document.createElement('script');
    s.src = PDFJS_BASE + 'pdf.min.js';
    s.onload = function(){
      if(!window.pdfjsLib){ reject(new Error('pdfjsLib 없음')); return; }
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.js';
      resolve(window.pdfjsLib);
    };
    s.onerror = function(){ pdfjsPromise = null; reject(new Error('PDF.js 로드 실패')); };
    document.head.appendChild(s);
  });
  return pdfjsPromise;
}

function closePdf(){
  pdfGen++;
  if(pdfState){
    if(pdfState.observer) pdfState.observer.disconnect();
    if(pdfState.task) try{ pdfState.task.destroy(); }catch(e){}
    if(pdfState.doc) try{ pdfState.doc.destroy(); }catch(e){}
    pdfState = null;
  }
  document.getElementById('pdfWrap').innerHTML = '';
}

function pdfDone(){
  document.getElementById('loading').style.display = 'none';
  document.getElementById('bottomNav').style.display = '';
}

function pdfFail(url, err){
  var wrap = document.getElementById('pdfWrap');
  wrap.innerHTML = '<div class="pdf-msg"><div style="font-size:40px;margin-bottom:12px">📄</div>'
    + '<p>PDF를 화면에 그리지 못했습니다.</p>'
    + '<p><a href="'+url+'" target="_blank" rel="noopener">PDF 새 창으로 열기</a></p></div>';
  if(window.console) console.error('[my_viewer] PDF 렌더링 실패:', err);
  pdfDone();
}

function renderPdf(url){
  var gen = pdfGen;
  var wrap = document.getElementById('pdfWrap');
  pdfState = {gen:gen, doc:null, observer:null, task:null};

  loadPdfJs().then(function(lib){
    if(gen !== pdfGen) return;
    var task = lib.getDocument({url:url});
    pdfState.task = task;
    return task.promise.then(function(doc){
      if(gen !== pdfGen){ doc.destroy(); return; }
      pdfState.doc = doc;
      // 1쪽 비율로 자리(placeholder)를 먼저 만들어 스크롤 길이를 잡는다
      return doc.getPage(1).then(function(p1){
        if(gen !== pdfGen) return;
        var vp1 = p1.getViewport({scale:1});
        var pages = [];
        for(var i=1;i<=doc.numPages;i++){
          var div = document.createElement('div');
          div.className = 'pdf-page';
          div.style.aspectRatio = vp1.width + ' / ' + vp1.height;
          div.dataset.page = i;
          div.innerHTML = '<span class="pg-no">'+i+' / '+doc.numPages+'</span>';
          wrap.appendChild(div);
          pages.push(div);
        }
        setupPdfObserver(doc, pages, gen);
        pdfDone();
      });
    });
  }).catch(function(err){
    if(gen !== pdfGen) return;
    pdfFail(url, err);
  });
}

function setupPdfObserver(doc, pages, gen){
  function draw(div){
    if(div.dataset.state) return;           // 'rendering' | 'done'
    div.dataset.state = 'rendering';
    var n = +div.dataset.page;
    doc.getPage(n).then(function(page){
      if(gen !== pdfGen || div.dataset.state !== 'rendering') return;
      var vp1 = page.getViewport({scale:1});
      // 실제 쪽 비율로 보정 (가로 페이지 섞인 PDF 대비)
      div.style.aspectRatio = vp1.width + ' / ' + vp1.height;
      var cssW = div.clientWidth || 800;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var scale = cssW / vp1.width * dpr;
      // iOS canvas 면적 한도(약 16.7M px) 아래로 제한
      var maxArea = 12000000;
      if(vp1.width*vp1.height*scale*scale > maxArea){
        scale = Math.sqrt(maxArea / (vp1.width*vp1.height));
      }
      var vp = page.getViewport({scale:scale});
      var canvas = document.createElement('canvas');
      canvas.width = Math.floor(vp.width);
      canvas.height = Math.floor(vp.height);
      var rt = page.render({canvasContext:canvas.getContext('2d'), viewport:vp});
      div._rt = rt;
      return rt.promise.then(function(){
        div._rt = null;
        if(gen !== pdfGen || div.dataset.state !== 'rendering'){ canvas.width = canvas.height = 0; return; }
        div.insertBefore(canvas, div.firstChild);
        div.dataset.state = 'done';
      });
    }).catch(function(err){
      if(err && err.name === 'RenderingCancelledException') return;
      delete div.dataset.state;
    });
  }
  function release(div){
    if(!div.dataset.state) return;
    if(div._rt){ try{ div._rt.cancel(); }catch(e){} div._rt = null; }
    var c = div.querySelector('canvas');
    if(c){ c.width = c.height = 0; c.remove(); }   // iOS는 0 크기로 줘야 메모리를 바로 돌려준다
    delete div.dataset.state;
  }

  if(!('IntersectionObserver' in window)){
    pages.forEach(draw);   // 구형 브라우저: 전부 그림
    return;
  }
  // 가까운 페이지(위아래 1.5화면)는 그리고, 멀어지면(4화면 밖) 해제
  var near = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if(e.isIntersecting) draw(e.target); });
  }, {rootMargin:'150% 0px'});
  var far = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if(!e.isIntersecting) release(e.target); });
  }, {rootMargin:'400% 0px'});
  pages.forEach(function(d){ near.observe(d); far.observe(d); });
  pdfState.observer = {disconnect:function(){ near.disconnect(); far.disconnect(); }};
}

function showError(){
  document.getElementById('loading').style.display = 'none';
  document.getElementById('pdfWrap').style.display = 'none';
  document.getElementById('reportFrame').style.display = '';
  document.getElementById('reportFrame').srcdoc =
    '<div style="padding:60px;text-align:center;font-family:sans-serif;color:#64748b">'
    +'<div style="font-size:48px;margin-bottom:16px">📭</div>'
    +'<p>파일을 찾을 수 없습니다.</p></div>';
}

// ── 초기화 ──────────────────────────────────────────────────
(function(){
  var file = getParam('file');
  if(!file && DATA.length > 0){
    // 파라미터 없으면 최신 파일 로드
    file = DATA[0].file || '';
  }
  if(file) loadReport(file);
  else showError();
})();
</script>
</body>
</html>
