<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>한국 주식 일일 리포트 — 주식 리서치 허브</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1a56db;--primary-dark:#1239a0;--primary-light:#3b82f6;
  --navy:#0f2244;--navy-mid:#1e3a5f;--accent:#60a5fa;
  --bg:#f0f5fb;--card:#fff;--border:#dbe8f8;
  --text:#1e293b;--muted:#64748b;--light:#94a3b8;
  --shadow-sm:0 1px 4px rgba(26,86,219,.08);
  --shadow-md:0 4px 20px rgba(26,86,219,.12);
  --radius:14px;--radius-sm:8px;
  --t:.22s cubic-bezier(.4,0,.2,1);
}
html{scroll-behavior:smooth}
body{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{text-decoration:none;color:inherit}
.navbar{position:sticky;top:0;z-index:100;background:var(--navy);box-shadow:0 2px 12px rgba(0,0,0,.3)}
.nb{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:8px;height:60px}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-size:1.05rem;font-weight:700;margin-right:12px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--primary-light),var(--accent));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.nav-links{display:flex;align-items:center;gap:2px;list-style:none;flex:1}
.nav-links a{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;color:rgba(255,255,255,.75);font-size:.88rem;font-weight:500;transition:var(--t)}
.nav-links a:hover,.nav-links a.active{background:rgba(255,255,255,.12);color:#fff}
.nav-right{display:flex;align-items:center;gap:10px}
#ts{color:rgba(255,255,255,.45);font-size:.75rem}
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-mid) 60%,#1a4070 100%);padding:44px 24px 40px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-60px;right:-80px;width:380px;height:380px;background:radial-gradient(circle,rgba(59,130,246,.18) 0%,transparent 70%);pointer-events:none}
.hi{max-width:1280px;margin:0 auto;position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:6px;background:rgba(96,165,250,.15);border:1px solid rgba(96,165,250,.3);color:var(--accent);font-size:.78rem;font-weight:600;padding:4px 12px;border-radius:20px;margin-bottom:14px;text-transform:uppercase;letter-spacing:.5px}
.hero-title{font-size:clamp(1.6rem,3.5vw,2.4rem);font-weight:800;color:#fff;line-height:1.2;letter-spacing:-.4px;margin-bottom:10px}
.hero-title span{background:linear-gradient(90deg,var(--accent),#a5f3fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-desc{color:rgba(255,255,255,.6);font-size:.95rem;line-height:1.7;max-width:520px;margin-bottom:24px}
.hero-meta{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hstat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px 20px}
.hstat-num{font-size:1.6rem;font-weight:800;color:#fff;line-height:1}
.hstat-label{font-size:.73rem;color:rgba(255,255,255,.5);margin-top:3px}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.18);font-size:.84rem;font-weight:600;transition:var(--t)}
.back:hover{background:rgba(255,255,255,.2);color:#fff}
.toolbar{max-width:1280px;margin:0 auto;padding:20px 24px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sw{position:relative;flex:1;min-width:200px}
.sw input{width:100%;padding:9px 14px 9px 38px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.875rem;background:var(--card);color:var(--text);outline:none;transition:var(--t)}
.sw input:focus{border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.si{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none}
.ytabs{display:flex;gap:6px;flex-wrap:wrap}
.ytab{padding:7px 16px;border-radius:20px;font-size:.82rem;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:var(--t)}
.ytab:hover{border-color:var(--primary-light);color:var(--primary)}
.ytab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.sort-btn{padding:7px 14px;border-radius:var(--radius-sm);font-size:.82rem;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:var(--t);white-space:nowrap}
.sort-btn:hover{border-color:var(--primary);color:var(--primary)}
.rc{font-size:.8rem;color:var(--light);white-space:nowrap}
.main{max-width:1280px;margin:0 auto;padding:20px 24px 60px}
.grid{display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;gap:14px;transition:var(--t);box-shadow:var(--shadow-sm)}
.card:hover{box-shadow:var(--shadow-md);transform:translateX(3px);border-color:var(--primary-light)}
.date-badge{background:#eff6ff;color:var(--primary);font-size:.8rem;font-weight:700;padding:6px 14px;border-radius:8px;white-space:nowrap;flex-shrink:0;min-width:96px;text-align:center;border:1px solid #bfdbfe}
.card-title{flex:1;font-size:.95rem;font-weight:600;color:var(--text)}
.btns{display:flex;gap:7px;flex-shrink:0}
.btn{font-size:.78rem;font-weight:600;padding:6px 13px;border-radius:7px;transition:var(--t);white-space:nowrap;border:1px solid;cursor:pointer}
.btn-kr{background:#eff6ff;color:var(--primary);border-color:#bfdbfe}
.btn-kr:hover{background:var(--primary);color:#fff}
.btn-us{background:#fef3c7;color:#92400e;border-color:#fde68a}
.btn-us:hover{background:#92400e;color:#fff}
.btn-stk{background:#f0fdf4;color:#15803d;border-color:#bbf7d0}
.btn-stk:hover{background:#15803d;color:#fff}
.btn-nl{background:#fff7ed;color:#c2410c;border-color:#fed7aa}
.btn-nl:hover{background:#c2410c;color:#fff}
.btn-dash{background:#f0fdf4;color:#15803d;border-color:#bbf7d0}
.btn-dash:hover{background:#15803d;color:#fff}
.btn-post{background:#faf5ff;color:#7c3aed;border-color:#ddd6fe}
.btn-post:hover{background:#7c3aed;color:#fff}
.sc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 22px;display:flex;align-items:center;gap:14px;transition:var(--t);box-shadow:var(--shadow-sm)}
.sc:hover{box-shadow:var(--shadow-md);transform:translateX(3px);border-color:var(--primary-light)}
.sc-icon{width:44px;height:44px;border-radius:12px;flex-shrink:0;background:linear-gradient(135deg,#d1fae5,#a7f3d0);display:flex;align-items:center;justify-content:center;font-size:20px}
.sc-info{flex:1}
.sc-name{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:3px}
.sc-date{font-size:.75rem;color:var(--light)}
.empty{text-align:center;padding:60px 24px;color:var(--light)}
.empty-icon{font-size:48px;margin-bottom:14px}
.mh{font-size:.82rem;font-weight:700;color:var(--muted);padding:18px 0 8px;letter-spacing:.3px;border-bottom:1px solid var(--border);margin-bottom:10px;display:flex;align-items:center;gap:8px}
#btt{position:fixed;bottom:32px;right:32px;width:44px;height:44px;background:var(--primary);color:#fff;border:none;border-radius:50%;font-size:18px;cursor:pointer;box-shadow:var(--shadow-md);display:none;align-items:center;justify-content:center;transition:var(--t);z-index:99}
#btt:hover{background:var(--primary-dark);transform:translateY(-2px)}
#btt.show{display:flex}
.footer{background:var(--navy);color:rgba(255,255,255,.45);text-align:center;padding:26px 24px;font-size:.8rem;line-height:1.8;margin-top:20px}
@media(max-width:700px){.card{flex-wrap:wrap}.nav-links{display:none}}

/* ── 페이지네이션 ─────────────────────────────────── */
.pagination{display:flex;align-items:center;justify-content:center;gap:6px;padding:24px 0 8px;flex-wrap:wrap}
.pg-btn{min-width:36px;height:36px;padding:0 10px;border-radius:8px;font-size:.83rem;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:var(--t);display:flex;align-items:center;justify-content:center}
.pg-btn:hover{border-color:var(--primary);color:var(--primary)}
.pg-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pg-btn:disabled{opacity:.35;cursor:default;pointer-events:none}
.pg-ellipsis{color:var(--light);font-size:.83rem;padding:0 4px}
</style>
<script src="../manifest.js"></script>
<script src="../navbar.js"></script>
</head>
<body>

<nav class="navbar">
  <div class="nb">
    <a href="../index.html" class="logo">
      <div class="logo-icon">📈</div>주식 리서치 허브
    </a>
    <ul class="nav-links"></ul>
    <div class="nav-right"><span id="ts"></span></div>
  </div>
</nav>

<section class="hero">
  <div class="hi">
    <div class="eyebrow">🇰🇷 Korean Market Daily</div>
    <h1 class="hero-title">한국 주식<br><span>일일 리포트</span></h1>
    <p class="hero-desc">KOSPI·KOSDAQ 장 마감 특징주 분석 리포트를 날짜별로 모아봤습니다.</p>
    <div class="hero-meta">
      <div class="hstat"><div class="hstat-num" id="hero-count">-</div><div class="hstat-label">총 건수</div></div>
      <div class="hstat"><div class="hstat-num" id="hero-date">-</div><div class="hstat-label">최신 날짜</div></div>
      <a href="../index.html" class="back">← 홈으로</a>
    </div>
  </div>
</section>

<div class="toolbar">
  <div class="sw"><span class="si">🔍</span>
    <input type="text" id="q" placeholder="날짜 또는 제목 검색..." oninput="filter()"/>
  </div>
  <div class="ytabs" id="ytabs"></div>
  <button class="sort-btn" id="sortBtn" onclick="toggleSort()">📅 최신순</button>
  <span class="rc" id="rc"></span>
</div>

<main class="main">
  <div class="grid" id="grid"></div>

<div class="pagination" id="pagination"></div>
</main>

<footer class="footer">주식 리서치 허브 &nbsp;|&nbsp; 📈 주식 데이터는 참고용이며 투자 권유가 아닙니다.</footer>
<button id="btt" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
// ── 데이터 ───────────────────────────────────────
var DATA = (window.SITE_MANIFEST && window.SITE_MANIFEST["Kr_Daily_Report"]) || [];

// ── hero 통계 동적 업데이트 ──────────────────────
function updateHeroStats(){
  var hc = document.getElementById('hero-count');
  var hd = document.getElementById('hero-date');
  if(hc) hc.textContent = DATA.length;
  if(hd && DATA.length){
    var d = DATA.reduce(function(m,i){return (i.date||'')>m?(i.date||''):m;},'');
    hd.textContent = d.replace(/-/g,'.');
  }
}


// ── 상태 ─────────────────────────────────────────

var PAGE_SIZE = 10;
var currentPage = 1;
var filteredData = [];

var sortAsc = false;

// ── 유틸 ─────────────────────────────────────────
function fmt(s){
  if(!s) return '';
  var p = s.split('-');
  return p.length===3 ? p[0]+'.'+p[1]+'.'+p[2] : s;
}
function monthOf(d){ return d ? d.substring(0,7) : ''; }
function monthLabel(m){ return m ? m.replace('-','.')+'월' : ''; }
function activeYear(){
  var el = document.querySelector('.ytab.active');
  return el ? (el.dataset.year||'all') : 'all';
}

// ── 렌더 ─────────────────────────────────────────
function render(items){
  filteredData = items.slice().sort(function(a,b){
    var da = (a.datetime||a.date||'').replace(/[^0-9]/g,'');
    var db = (b.datetime||b.date||'').replace(/[^0-9]/g,'');
    return sortAsc ? da.localeCompare(db) : db.localeCompare(da);
  });
  document.getElementById('rc').textContent = filteredData.length + '건';
  renderPage(1);
}

function renderItems(items){
  var grid = document.getElementById('grid');
  if(!items.length){
    grid.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><p>검색 결과가 없습니다.</p></div>';
    return;
  }
  var prev='', html='';
  items.forEach(function(item){
    var mo = monthOf(item.date);
    if(mo !== prev){ html += '<div class="mh">📅 '+monthLabel(mo)+'</div>'; prev=mo; }
    var btns='';
    if(item.file) btns='<a class="btn btn-kr" href="kr_viewer.html?file='+item.file+'">📝 리포트</a>';
    else {
      if(item.dashboard) btns+='<a class="btn btn-kr" href="kr_viewer.html?file='+item.dashboard+'">📊 대시보드</a>';
      if(item.post) btns+='<a class="btn btn-dash" href="kr_viewer.html?file='+item.post+'">📝 포스트</a>';
    }
    html += '<div class="card">'
      +'<span class="date-badge">'+fmt(item.date)+(item.datetime&&item.datetime.length>10?'<br><span style="font-size:.7em;font-weight:400;opacity:.75">'+item.datetime.substring(11)+'</span>':'')+'</span>'
      +'<span class="card-title">'+(item.title||item.date)+'</span>'
      +'<div class="btns">'+btns+'</div></div>';
  });
  grid.innerHTML = html;
}


// ── 페이지네이션 ─────────────────────────────────
function renderPage(page){
  var total = filteredData.length;
  var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(page < 1) page = 1;
  if(page > totalPages) page = totalPages;
  currentPage = page;
  var start = (currentPage - 1) * PAGE_SIZE;
  renderItems(filteredData.slice(start, start + PAGE_SIZE));
  renderPagination(totalPages);
  var grid = document.getElementById('grid');
  if(grid) window.scrollTo({top: grid.offsetTop - 80, behavior: 'smooth'});
}

function renderPagination(totalPages){
  var pg = document.getElementById('pagination');
  if(!pg) return;
  if(totalPages <= 1){ pg.innerHTML = ''; return; }
  var html = '';
  html += '<button class="pg-btn" onclick="renderPage(currentPage-1)"'+(currentPage===1?' disabled':'')+'>◀</button>';
  for(var i=1; i<=totalPages; i++){
    if(totalPages > 7 && i > 2 && i < totalPages-1 && Math.abs(i-currentPage) > 1){
      if(i===3 || i===totalPages-2) html += '<span class="pg-ellipsis">…</span>';
      continue;
    }
    html += '<button class="pg-btn'+(i===currentPage?' active':'')+'" onclick="renderPage('+i+')">'+i+'</button>';
  }
  html += '<button class="pg-btn" onclick="renderPage(currentPage+1)"'+(currentPage===totalPages?' disabled':'')+'>▶</button>';
  pg.innerHTML = html;
}

// ── 필터 ─────────────────────────────────────────
function filter(){
  var q = document.getElementById('q').value.toLowerCase();
  var ay = activeYear();
  var f = DATA.filter(function(i){
    var mq = !q || (i.date||'').replace(/-/g,'.').includes(q)
           || (i.title||'').toLowerCase().includes(q)
           || (i.name||'').toLowerCase().includes(q);
    var my = ay==='all' || (i.date||'').startsWith(ay);
    return mq && my;
  });
  render(f);
}

// ── 정렬 ─────────────────────────────────────────
function toggleSort(){
  sortAsc = !sortAsc;
  document.getElementById('sortBtn').textContent = sortAsc ? '📅 과거순' : '📅 최신순';
  filter();
}

// ── 연도 탭 ──────────────────────────────────────
function setYear(y, el){
  document.querySelectorAll('.ytab').forEach(function(t){ t.classList.remove('active'); });
  el.classList.add('active');
  filter();
}
(function buildYearTabs(){
  var years = [];
  DATA.forEach(function(i){
    var y = (i.date||'').substring(0,4);
    if(y && years.indexOf(y)===-1) years.push(y);
  });
  var html = '<button class="ytab active" data-year="all" onclick="setYear(\'all\',this)">전체</button>';
  years.forEach(function(y){
    html += '<button class="ytab" data-year="'+y+'" onclick="setYear(\''+y+'\',this)">'+y+'년</button>';
  });
  document.getElementById('ytabs').innerHTML = html;
})();

// ── 스크롤 탑 ────────────────────────────────────
window.addEventListener('scroll', function(){
  document.getElementById('btt').classList.toggle('show', window.scrollY>300);
});

// ── 초기 렌더 ────────────────────────────────────
updateHeroStats();
render(DATA);
</script>
</body>
</html>
